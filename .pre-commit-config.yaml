# Secret scanning at commit time, under GitHub's push protection rather than
# instead of it. Push protection is the one that cannot be skipped; this one
# fires earlier, so a key never reaches a commit object that has to be rewritten.
#
# Deliberately only this hook. Formatters and linters here would run on every
# commit of a six-day build and buy nothing the test suite does not already say.
repos:
  # Pinned, never `rev: main`. The scanner's own rules decide what counts as a
  # secret, so an unpinned bump changes the gate without changing this file.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
